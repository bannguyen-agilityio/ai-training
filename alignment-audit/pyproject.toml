[project]
name = "alignment-audit"
version = "0.1.0"
description = "Alignment audit proof: a verifiable trace of an agent detecting its own goal drift and halting before an unauthorized action"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.59.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
audit = "alignment_audit.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alignment_audit"]

[tool.ruff]
line-length = 100
