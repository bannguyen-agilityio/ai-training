[project]
name = "meta-refiner"
version = "0.1.0"
description = "Meta-prompting: one LLM refines prompts for another to handle underspecified queries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai", "python-dotenv"]

[project.scripts]
meta-refine = "meta_refiner.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_refiner"]

[tool.ruff]
line-length = 100
