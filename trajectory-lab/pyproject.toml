[project]
name = "trajectory-lab"
version = "0.1.0"
description = "Practice agent trajectory analysis with Langfuse"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["langfuse>=4", "openai", "python-dotenv"]

[project.scripts]
traj-agent = "trajectory_lab.agent:main"
traj-analyze = "trajectory_lab.analyze:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_lab"]

[tool.ruff]
line-length = 100
